name: Build Android app

on:
  push:
    paths:
      - "android/**"
      - "health.html"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle -p android assembleDebug --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk health-profiler.apk

      - uses: actions/upload-artifact@v4
        with:
          name: health-profiler-apk
          path: health-profiler.apk

      # Only builds of the main branch become a downloadable release.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Health Profiler (build ${{ github.run_number }})
          body: |
            Install on your Android phone: download `health-profiler.apk` below, open it, and allow installing from this source if asked.
            Later builds install over this one and keep your data.
          files: health-profiler.apk
          make_latest: true
